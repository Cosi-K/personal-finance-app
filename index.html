<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayStamp — Monthly Planner</title>
<meta name="description" content="PayStamp — plan where every pound of your monthly pay goes, and stamp each month into your record.">
<meta name="theme-color" content="#7E2A55">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%237E2A55'/%3E%3Ccircle cx='24' cy='24' r='17.5' fill='none' stroke='%23FBF9F4' stroke-width='1.6' stroke-dasharray='2.6 2.4'/%3E%3Ctext x='24' y='32' text-anchor='middle' font-family='Georgia,serif' font-size='23' fill='%23FBF9F4'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#FBF9F4;color-scheme:light;}
  a{text-decoration:none}
  button, input, textarea, select{font-family:inherit;}
  .corner-btn{transition:opacity .15s}
  .corner-btn:hover{opacity:.92}
  .menu-link{transition:background .15s}
  .menu-link:hover{background:rgba(255,255,255,.14)}
  .month-select{transition:border-color .15s}
  .month-select:hover{border-color:#C8C2B2}
  .row-input{transition:background .15s;border-radius:5px}
  .row-input:focus{background:rgba(0,0,0,.06);outline:none}
  .row-remove{transition:opacity .15s}
  .row-remove:hover{opacity:1}
  .dash-btn{transition:background .15s,transform .15s}
  .dash-btn:hover{background:rgba(0,0,0,.05);transform:scale(1.06);}
  .cat-name-input{transition:background .15s;border-radius:6px}
  .cat-name-input:focus{background:rgba(255,255,255,.25);outline:none}
  @keyframes dropOpen{from{opacity:0;transform:scaleY(.35);}to{opacity:1;transform:scaleY(1);}}
  .drop-panel{transform-origin:top;animation:dropOpen .22s cubic-bezier(.16,1,.3,1);}
  .stamp-btn{transition:transform .15s,box-shadow .15s;}
  .stamp-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(126,42,85,.42);}
  .stamp-btn:active{transform:scale(.94);}
  @keyframes stampBurst{0%{transform:scale(1);}45%{transform:scale(1.14);}100%{transform:scale(1);}}
  .stamp-flash{animation:stampBurst .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes stampToastIn{from{opacity:0;transform:translateY(8px) scale(.92);}to{opacity:1;transform:translateY(0) scale(1);}}
  .stamp-toast{animation:stampToastIn .35s cubic-bezier(.16,1,.3,1);}
  @keyframes cornerPulse{0%,100%{box-shadow:0 4px 12px rgba(126,42,85,.28);}50%{box-shadow:0 4px 26px rgba(126,42,85,.7),0 0 0 7px rgba(126,42,85,.16);}}
  .corner-pulse{animation:cornerPulse 1.1s ease-in-out 3;}
  @media (max-width: 900px) {
    .planner-grid{grid-template-columns:1fr !important;}
  }
  @media (max-width: 640px) {
    .planner-page{padding:28px 18px 48px !important;}
  }
  @media (prefers-reduced-motion: reduce) {
    .drop-panel{animation:none;}
  }

  /* ---------- account / login screen ---------- */
  #auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;box-sizing:border-box;}
  #auth[hidden], #app[hidden]{display:none;}
  .auth-card{width:100%;max-width:400px;background:#FFFFFF;border-radius:20px;box-shadow:0 1px 2px rgba(33,28,46,.06),0 16px 44px rgba(33,28,46,.12);padding:36px 32px 28px;box-sizing:border-box;}
  .ps-logo{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ps-logo svg{display:block;width:100%;height:100%;}
  .ps-brand{display:inline-flex;align-items:center;gap:9px;font-family:'DM Serif Display',Georgia,serif;color:#7E2A55;letter-spacing:.01em;}
  .auth-logo{display:flex;justify-content:center;margin-bottom:10px;}
  .auth-tagline{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#7E2A55;text-align:center;margin-top:6px;}
  .auth-brand{font-family:'DM Serif Display',Georgia,serif;font-size:36px;color:#211C2E;text-align:center;line-height:1.1;}
  .auth-rule{width:56px;height:4px;border-radius:2px;background:#7E2A55;margin:12px auto 10px;}
  .auth-sub{font-size:14px;color:#6B6478;text-align:center;margin:0 0 24px;line-height:1.45;}
  .auth-tabs{display:flex;background:#F3EEE3;border-radius:999px;padding:4px;margin-bottom:22px;}
  .auth-tab{flex:1;border:none;background:transparent;border-radius:999px;padding:9px 0;font-size:13.5px;font-weight:600;color:#6B6478;cursor:pointer;transition:background .15s,color .15s;}
  .auth-tab[aria-selected="true"]{background:#7E2A55;color:#FBF9F4;}
  .auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .auth-field label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#5A5266;}
  .auth-field input{border:1.5px solid #E4DFD3;border-radius:10px;padding:11px 13px;font-size:15px;color:#211C2E;background:#FBF9F4;transition:border-color .15s;}
  .auth-field input:focus{outline:none;border-color:#7E2A55;background:#FFFFFF;}
  .auth-submit{width:100%;border:none;border-radius:999px;background:#7E2A55;color:#FBF9F4;font-size:15px;font-weight:700;padding:13px 0;cursor:pointer;margin-top:6px;box-shadow:0 6px 18px rgba(126,42,85,.3);transition:transform .15s,opacity .15s;}
  .auth-submit:hover{transform:translateY(-1px);}
  .auth-submit:disabled{opacity:.6;cursor:default;transform:none;}
  .auth-link{border:none;background:none;color:#7E2A55;font-size:13px;font-weight:600;cursor:pointer;padding:4px;}
  .auth-foot{display:flex;justify-content:center;margin-top:14px;}
  .auth-msg{font-size:13.5px;line-height:1.45;border-radius:10px;padding:10px 13px;margin-bottom:16px;}
  .auth-msg.error{background:#F8E7E5;color:#8A2C24;}
  .auth-msg.ok{background:#E3F1E8;color:#00602A;}
  .auth-msg.info{background:#FFF6CC;color:#3A2E00;}
  .auth-demo{width:100%;border:1.5px solid #E4DFD3;border-radius:999px;background:transparent;color:#4A4356;font-size:13.5px;font-weight:600;padding:11px 0;cursor:pointer;margin-top:10px;}
  .auth-loading{font-size:14px;color:#6B6478;text-align:center;padding:24px 0;}

  /* ---------- save status pill ---------- */
  #save-status{position:fixed;bottom:18px;left:18px;z-index:50;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;background:#FFFFFF;color:#4A4356;box-shadow:0 4px 14px rgba(33,28,46,.14);display:flex;align-items:center;gap:7px;transition:opacity .3s;}
  #save-status[hidden]{display:none;}
  #save-status .dot{width:8px;height:8px;border-radius:50%;background:#00602A;}
  #save-status.saving .dot{background:#C99A00;}
  #save-status.error{background:#F8E7E5;color:#8A2C24;}
  #save-status.error .dot{background:#8A2C24;}
  #save-status.demo{background:#FFF6CC;color:#3A2E00;}
  #save-status.demo .dot{background:#C99A00;}
</style>
</head>

<div id="auth"><div class="auth-card"><div class="auth-loading">Loading…</div></div></div>
<div id="app" hidden></div>
<div id="save-status" hidden><span class="dot"></span><span class="label">Saved</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

<script>
/* =====================================================================
   1) YOUR SUPABASE KEYS
   Supabase dashboard → Project Settings → API. Paste the Project URL and
   the "anon public" key below. (The anon key is safe to publish — the
   database rules in supabase-setup.sql stop anyone reading others' data.)
   ===================================================================== */
var SUPABASE_URL = 'https://oyrumnbxadhcqsdfqnkj.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_8Ti3vzyfY0cOOSedUd0nUg_SAOupy49';
</script>

<script>
/* =====================================================================
   2) ACCOUNTS + SAVING  (talks to Supabase, then hands data to the planner)
   ===================================================================== */
(function () {
  'use strict';

  // Only these parts of the planner are saved. Things like "which menu is
  // open" are not. Month/year aren't saved either, so each visit opens on
  // the current month.
  var SAVED_KEYS = ['groups', 'locations', 'targets', 'aims', 'notes', 'records', 'recExpanded'];

  var configured = /^https:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.indexOf('PASTE_') !== 0;
  var sb = configured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  var authEl = document.getElementById('auth');
  var appEl = document.getElementById('app');
  var statusEl = document.getElementById('save-status');

  var user = null;
  var demoMode = false;
  var plannerStarted = false;
  var lastSaved = null;
  var saveTimer = null;
  var saving = false;
  var pendingSnapshot = null;

  /* ---------- save status pill ---------- */
  function setStatus(kind, text) {
    statusEl.hidden = false;
    statusEl.className = kind || '';
    statusEl.querySelector('.label').textContent = text;
  }

  /* ---------- saving ---------- */
  function snapshot(state) {
    var out = {};
    SAVED_KEYS.forEach(function (k) { if (state[k] !== undefined) out[k] = state[k]; });
    return out;
  }

  function queueSave(state) {
    if (demoMode || !user) return;
    var snap = snapshot(state);
    var json = JSON.stringify(snap);
    if (json === lastSaved) return;          // nothing that matters changed
    pendingSnapshot = snap;
    setStatus('saving', 'Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 700);
  }

  function flushSave() {
    clearTimeout(saveTimer);
    if (!pendingSnapshot || !user || saving) return;
    var snap = pendingSnapshot;
    var json = JSON.stringify(snap);
    pendingSnapshot = null;
    saving = true;
    sb.from('planners')
      .upsert({ user_id: user.id, data: snap, updated_at: new Date().toISOString() })
      .then(function (res) {
        saving = false;
        if (res.error) {
          pendingSnapshot = pendingSnapshot || snap;   // keep it so we retry
          setStatus('error', "Couldn't save — retrying…");
          saveTimer = setTimeout(flushSave, 4000);
          return;
        }
        lastSaved = json;
        if (pendingSnapshot) { flushSave(); } else { setStatus('', 'All changes saved'); }
      });
  }

  window.addEventListener('beforeunload', function (e) {
    if (pendingSnapshot || saving) { flushSave(); e.preventDefault(); e.returnValue = ''; }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushSave();
  });

  /* ---------- loading a user's planner ---------- */
  function openPlanner(initialData) {
    authEl.hidden = true;
    appEl.hidden = false;
    if (!plannerStarted) {
      plannerStarted = true;
      window.PlannerApp.start(initialData);
    }
  }

  function loadForUser(u) {
    user = u;
    renderAuth('loading');
    sb.from('planners').select('data').eq('user_id', u.id).maybeSingle().then(function (res) {
      if (res.error) {
        renderAuth('signin', { error: "We couldn't load your planner (" + res.error.message + '). Check the database setup, then refresh.' });
        return;
      }
      var saved = res.data && res.data.data;
      if (saved) {
        lastSaved = JSON.stringify(snapshot(saved));
        setStatus('', 'All changes saved');
        openPlanner(saved);
      } else {
        // Brand-new account: start from the example plan and show the tour.
        setStatus('', 'Welcome — your changes save automatically');
        openPlanner({ introOpen: true, introStep: 0 });
      }
    });
  }

  /* ---------- the login / sign-up screen ---------- */
  function friendlyError(err) {
    var m = (err && err.message) || 'Something went wrong. Please try again.';
    if (/invalid login credentials/i.test(m)) return 'That email and password don’t match an account.';
    if (/email not confirmed/i.test(m)) return 'Please confirm your email first — check your inbox for the link we sent.';
    if (/already registered/i.test(m)) return 'There’s already an account with that email. Try signing in instead.';
    if (/password should be at least/i.test(m)) return 'Your password needs to be at least 6 characters.';
    return m;
  }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function field(id, label, type, autocomplete) {
    var input = el('input', { id: id, name: id, type: type, required: '', autocomplete: autocomplete });
    if (type === 'password') input.setAttribute('minlength', '6');
    return el('div', { class: 'auth-field' }, [el('label', { for: id, text: label }), input]);
  }

  function renderAuth(mode, opts) {
    opts = opts || {};
    authEl.hidden = false;
    appEl.hidden = true;
    var card = el('div', { class: 'auth-card' });
    card.appendChild(el('div', { class: 'auth-logo' }, [window.payStampLogo(56)]));
    card.appendChild(el('div', { class: 'auth-brand', text: 'PayStamp' }));
    card.appendChild(el('div', { class: 'auth-tagline', text: 'Monthly Planner' }));
    card.appendChild(el('div', { class: 'auth-rule' }));

    if (mode === 'loading') {
      card.appendChild(el('div', { class: 'auth-loading', text: 'Opening your planner…' }));
      authEl.replaceChildren(card);
      return;
    }

    var subs = {
      signin: 'Welcome back. Sign in to pick up your plan where you left it.',
      signup: 'Create a free account so your plan is saved and ready every month.',
      reset: 'Enter your email and we’ll send you a link to reset your password.',
      newpass: 'Choose a new password for your account.',
    };
    card.appendChild(el('p', { class: 'auth-sub', text: subs[mode] }));

    if (!configured) {
      card.appendChild(el('div', { class: 'auth-msg info', text: 'Accounts aren’t switched on yet: add your Supabase URL and anon key near the top of this file. You can still try the planner without saving.' }));
    }

    if (mode === 'signin' || mode === 'signup') {
      var tabs = el('div', { class: 'auth-tabs', role: 'tablist' });
      [['signin', 'Sign in'], ['signup', 'Create account']].forEach(function (t) {
        var b = el('button', { type: 'button', class: 'auth-tab', role: 'tab', 'aria-selected': String(mode === t[0]), text: t[1] });
        b.addEventListener('click', function () { renderAuth(t[0]); });
        tabs.appendChild(b);
      });
      card.appendChild(tabs);
    }

    if (opts.error) card.appendChild(el('div', { class: 'auth-msg error', text: opts.error }));
    if (opts.ok) card.appendChild(el('div', { class: 'auth-msg ok', text: opts.ok }));

    var form = el('form', { novalidate: '' });
    if (mode !== 'newpass') form.appendChild(field('email', 'Email', 'email', 'email'));
    if (mode === 'signin') form.appendChild(field('password', 'Password', 'password', 'current-password'));
    if (mode === 'signup' || mode === 'newpass') form.appendChild(field('password', mode === 'newpass' ? 'New password' : 'Password (6+ characters)', 'password', 'new-password'));
    if (opts.email && form.querySelector('#email')) form.querySelector('#email').value = opts.email;

    var labels = { signin: 'Sign in', signup: 'Create account', reset: 'Send reset link', newpass: 'Save new password' };
    var submit = el('button', { type: 'submit', class: 'auth-submit', text: labels[mode] });
    if (!configured) submit.disabled = true;
    form.appendChild(submit);
    card.appendChild(form);

    var foot = el('div', { class: 'auth-foot' });
    if (mode === 'signin') {
      var forgot = el('button', { type: 'button', class: 'auth-link', text: 'Forgot your password?' });
      forgot.addEventListener('click', function () { renderAuth('reset', { email: form.querySelector('#email').value }); });
      foot.appendChild(forgot);
    } else if (mode === 'reset') {
      var back = el('button', { type: 'button', class: 'auth-link', text: '← Back to sign in' });
      back.addEventListener('click', function () { renderAuth('signin'); });
      foot.appendChild(back);
    }
    if (foot.childNodes.length) card.appendChild(foot);

    if (!configured) {
      var demo = el('button', { type: 'button', class: 'auth-demo', text: 'Try it without an account (nothing is saved)' });
      demo.addEventListener('click', function () {
        demoMode = true;
        setStatus('demo', 'Demo mode — changes aren’t saved');
        openPlanner({ introOpen: true, introStep: 0 });
      });
      card.appendChild(demo);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!configured) return;
      var email = form.querySelector('#email') ? form.querySelector('#email').value.trim() : '';
      var password = form.querySelector('#password') ? form.querySelector('#password').value : '';
      if (mode !== 'newpass' && !/^\S+@\S+\.\S+$/.test(email)) { renderAuth(mode, { error: 'Please enter a valid email address.', email: email }); return; }
      if ((mode === 'signin' || mode === 'signup' || mode === 'newpass') && password.length < 6) { renderAuth(mode, { error: 'Your password needs to be at least 6 characters.', email: email }); return; }
      submit.disabled = true;
      submit.textContent = 'Please wait…';

      var here = window.location.origin + window.location.pathname;
      if (mode === 'signin') {
        sb.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
          if (res.error) renderAuth('signin', { error: friendlyError(res.error), email: email });
          // success is handled by onAuthStateChange below
        });
      } else if (mode === 'signup') {
        sb.auth.signUp({ email: email, password: password, options: { emailRedirectTo: here } }).then(function (res) {
          if (res.error) { renderAuth('signup', { error: friendlyError(res.error), email: email }); return; }
          if (!res.data.session) {
            renderAuth('signin', { ok: 'Nearly there! We’ve emailed a confirmation link to ' + email + '. Click it, then sign in here.', email: email });
          }
        });
      } else if (mode === 'reset') {
        sb.auth.resetPasswordForEmail(email, { redirectTo: here }).then(function (res) {
          if (res.error) renderAuth('reset', { error: friendlyError(res.error), email: email });
          else renderAuth('signin', { ok: 'If there’s an account for ' + email + ', a reset link is on its way.', email: email });
        });
      } else if (mode === 'newpass') {
        sb.auth.updateUser({ password: password }).then(function (res) {
          if (res.error) { renderAuth('newpass', { error: friendlyError(res.error) }); return; }
          loadForUser(res.data.user);
        });
      }
    });

    authEl.replaceChildren(card);
    var first = card.querySelector('input');
    if (first && !first.value) first.focus();
  }

  /* ---------- what the planner can ask of us ---------- */
  window.PayStamp = {
    onChange: queueSave,
    getEmail: function () { return user ? user.email : (demoMode ? 'Demo mode' : ''); },
    signOut: function () {
      if (demoMode || !sb) { window.location.reload(); return; }
      flushSave();
      setTimeout(function () {
        sb.auth.signOut().then(function () { window.location.reload(); });
      }, saving ? 800 : 0);
    },
  };

  /* ---------- boot ---------- */
  if (!sb) { renderAuth('signin'); return; }

  var recovering = /type=recovery/.test(window.location.hash);
  sb.auth.onAuthStateChange(function (event, session) {
    // Run outside the callback so Supabase isn't blocked while we query.
    setTimeout(function () {
      if (event === 'PASSWORD_RECOVERY') { recovering = true; user = session && session.user; renderAuth('newpass'); return; }
      if (recovering) return;
      if (session && session.user) {
        if (!user || user.id !== session.user.id) loadForUser(session.user);
      } else if (event === 'SIGNED_OUT' || event === 'INITIAL_SESSION') {
        user = null;
        if (!plannerStarted) renderAuth('signin');
      }
    }, 0);
  });
})();
</script>

<script>
/* =====================================================================
   3) THE MONTHLY PLANNER
   ===================================================================== */
(function () {
  'use strict';

  var state = {};

  function setState(patch) {
    Object.assign(state, patch);
    render();
    if (window.PayStamp) window.PayStamp.onChange(state);
  }

  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function currentMonthName() { return MONTH_NAMES[new Date().getMonth()]; }

  /* ---------- data / logic layer (ported from the planner's component) ---------- */

  function blankAuto() {
    return { account: '', runs: '', due: '', automated: false };
  }

  function defaultGroups() {
    var A = function () { return blankAuto(); };
    var B = function (account, runs, due) { return { account: account, runs: runs, due: due, automated: account === 'Monzo' }; };
    return [
      {
        key: 'income', title: 'Income', color: '#7E2A55',
        categories: [
          { id: 'cat_income', name: 'Job', items: [
            Object.assign({ id: 'i1', label: 'Salary', target: '1750', budgeted: '1750' }, A()),
            Object.assign({ id: 'i2', label: 'Extras', target: '150', budgeted: '150' }, A()),
          ] },
        ],
      },
      {
        key: 'investSavings', title: 'Investments & Savings', color: '#00602A',
        categories: [
          { id: 'cat_invest', name: 'Investments', items: [
            Object.assign({ id: 'v1', label: 'Stocks & Shares ISA', target: '173', budgeted: '173' }, B('Barclays', '1st', '')),
          ] },
          { id: 'cat_savings', name: 'Savings', items: [
            Object.assign({ id: 's1', label: 'Emergency fund', target: '40', budgeted: '40' }, B('Monzo', '3rd', '')),
            Object.assign({ id: 's2', label: 'Christmas pot', target: '15', budgeted: '15' }, B('Monzo', '3rd', '')),
          ] },
        ],
      },
      {
        key: 'costs', title: 'Costs', color: '#8A2C24',
        categories: [

    });

    var totalBox = h('div', { style: 'border-radius:20px;overflow:hidden;background:#E6F0FC;box-shadow:inset 0 0 0 1.5px #AFCBEE;padding:14px;display:flex;flex-direction:column;gap:8px;margin-top:-20px;' });
    totalBox.appendChild(h('div', { style: 'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#1D4E82;', text: 'Total per location' }));
    vals.locationTotals.forEach(function (loc) {
      var row = h('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;' });
      row.appendChild(h('span', { style: 'font-size:12.5px;color:#1D4E82;font-weight:600;', text: loc.name }));
      row.appendChild(h('span', { style: 'font-size:13.5px;color:#1D4E82;font-weight:700;', text: loc.total }));
      totalBox.appendChild(row);
    });
    col.appendChild(totalBox);

    return col;
  }

  function buildBalanceCard(vals) {
    var b = vals.balance;
    var outer = h('div', { style: 'display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start;width:100%;box-sizing:border-box;' });
    var card = h('div', { id: 'tour-balance', style: 'background:' + b.bg + ';border:1.5px solid ' + b.border + ';border-radius:14px;padding:28px 32px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;' + vals.hiliteBalance });

    var row1 = h('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;' });
    row1.appendChild(h('span', { style: 'font-size:14.5px;color:#4A4356;font-weight:500;', text: 'Take-home pay' }));
    row1.appendChild(h('span', { style: "font-family:'DM Serif Display',Georgia,serif;font-size:21px;color:#211C2E;", text: b.income }));
    card.appendChild(row1);

    var row2 = h('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;' });
    row2.appendChild(h('span', { style: 'font-size:14.5px;color:#4A4356;font-weight:500;', text: 'Category totals' }));
    row2.appendChild(h('span', { style: "font-family:'DM Serif Display',Georgia,serif;font-size:21px;color:#211C2E;", text: b.allocated }));
    card.appendChild(row2);

    card.appendChild(h('div', { style: 'border-top:1px solid ' + b.border + ';margin-top:2px;' }));

    var row3 = h('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;padding-top:6px;' });
    row3.appendChild(h('span', { style: 'font-size:14.5px;color:' + b.color + ';font-weight:700;', text: 'Zero-based balance' }));
    row3.appendChild(h('span', { style: "font-family:'DM Serif Display',Georgia,serif;font-size:21px;color:" + b.color + ";font-weight:700;", text: b.amount }));
    card.appendChild(row3);

    card.appendChild(h('div', { style: 'font-size:13px;color:#6B6478;text-align:right;', text: b.message }));

    outer.appendChild(card);
    outer.appendChild(h('div', {}));
    return outer;
  }

  function buildStampBlock(vals) {
    var outer = h('div', { style: 'display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start;width:100%;box-sizing:border-box;' });
    var wrap = h('div', { id: 'tour-stamp', style: 'display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:24px;' + vals.hiliteStamp });
    wrap.appendChild(buttonEl({ ariaLabel: 'Stamp this month into your record', onClick: vals.stampMonth, className: 'stamp-btn' + vals.stampFlashClass, style: "padding:18px 56px;border:none;border-radius:999px;background:#7E2A55;color:#FBF9F4;font-family:'DM Serif Display',Georgia,serif;font-size:27px;letter-spacing:.03em;cursor:pointer;box-shadow:0 8px 22px rgba(126,42,85,.4);" }, ['STAMP']));
    wrap.appendChild(h('div', { style: 'font-size:12.5px;color:#6B6478;', text: 'Stamp this month into your record' }));
    if (vals.stampFlash) {
      wrap.appendChild(h('div', { class: 'stamp-toast', style: 'background:#211C2E;color:#FBF9F4;font-size:13px;font-weight:600;padding:10px 20px;border-radius:999px;box-shadow:0 10px 24px rgba(33,28,46,.3);text-align:center;', text: '✓ ' + vals.stampFlashLabel + ' stamped — check Records (top left) to see it' }));
    }
    outer.appendChild(wrap);
    outer.appendChild(h('div', {}));
    return outer;
  }

  function buildMain(vals) {
    var page = h('div', { class: 'planner-page', style: 'padding:40px 96px 60px;display:flex;flex-direction:column;gap:28px;box-sizing:border-box;' });
    page.appendChild(buildHeader(vals));

    var content = h('div', { style: 'display:flex;flex-direction:column;gap:28px;max-width:1180px;margin:0 auto;width:100%;' });

    var grid = h('div', { class: 'planner-grid', style: 'display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start;' });
    grid.appendChild(buildMainPanel(vals));
    grid.appendChild(buildRightPanel(vals));
    content.appendChild(grid);

    content.appendChild(buildBalanceCard(vals));
    content.appendChild(buildStampBlock(vals));

    page.appendChild(content);
    return page;
  }

  function buildApp(vals) {
    var wrap = h('div', { style: "position:relative;min-height:100vh;background:#FBF9F4;font-family:'DM Sans',system-ui,sans-serif;color:#211C2E;" });
    if (vals.recordsOpen) wrap.appendChild(buildRecordsOverlay(vals));
    if (vals.introOpen) wrap.appendChild(buildIntroCard(vals));
    wrap.appendChild(buildCorner('left', vals));
    wrap.appendChild(buildCorner('right', vals));
    wrap.appendChild(buildMain(vals));
    return wrap;
  }

  /* ---------- boot (the account layer above calls start() once you're signed in) ---------- */

  function render() {
    var scrollY = window.scrollY;
    var root = document.getElementById('app');
    root.innerHTML = '';
    var vals = computeVals();
    root.appendChild(buildApp(vals));
    window.scrollTo(0, scrollY);
  }

  function start(initialData) {
    Object.assign(state, initialData || {});
    render();
  }

  window.PlannerApp = { start: start };
})();
</script>
</body>
</html>
